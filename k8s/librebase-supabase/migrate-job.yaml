apiVersion: batch/v1
kind: Job
metadata:
  name: librebase-supabase-migrate
  namespace: librebase-supabase
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        job: librebase-supabase-migrate
    spec:
      initContainers:
      - name: wait-db
        image: postgres:15-alpine
        command: ["sh", "-c", "until pg_isready -h db -p 5432 -U postgres; do sleep 2; done"]
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: librebase-supabase-secrets
      containers:
      - name: migrate
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        command: ["sh", "/scripts/migrate.sh"]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: librebase-supabase-secrets
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: librebase-supabase-secrets
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: engine
      volumes:
      - name: migrations
        configMap:
          name: librebase-supabase-migrations
          defaultMode: 420
      - name: scripts
        configMap:
          name: librebase-supabase-migrate-scripts
          defaultMode: 493
