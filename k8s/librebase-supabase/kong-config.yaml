apiVersion: v1
kind: ConfigMap
metadata:
  name: librebase-supabase-kong-config
  namespace: librebase-supabase
data:
  kong-entrypoint.sh: |
    #!/bin/sh
    set -eu
    export LUA_AUTH_EXPR='$((headers.authorization ~= nil and headers.authorization) or headers.apikey)'
    export LUA_RT_WS_EXPR='$(query_params.apikey)'
    awk '{
      result = ""
      rest = $0
      while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
        varname = substr(rest, RSTART + 1, RLENGTH - 1)
        if (varname in ENVIRON) {
          result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
        } else {
          result = result substr(rest, 1, RSTART + RLENGTH - 1)
        }
        rest = substr(rest, RSTART + RLENGTH)
      }
      print result rest
    }' /home/kong/temp.yml > "${KONG_DECLARATIVE_CONFIG:-/kong-out/kong.yml}"
    echo "rendered kong config"
  kong.yml: |
    _format_version: "2.1"
    _transform: true

    consumers:
      - username: DASHBOARD
      - username: anon
        keyauth_credentials:
          - key: $SUPABASE_ANON_KEY
      - username: service_role
        keyauth_credentials:
          - key: $SUPABASE_SERVICE_KEY

    acls:
      - consumer: anon
        group: anon
      - consumer: service_role
        group: admin

    basicauth_credentials:
      - consumer: DASHBOARD
        username: "$DASHBOARD_USERNAME"
        password: "$DASHBOARD_PASSWORD"

    services:
      - name: auth-v1-open
        url: http://auth:9999/verify
        routes:
          - name: auth-v1-open
            strip_path: true
            paths:
              - /auth/v1/verify
        plugins:
          - name: cors
      - name: auth-v1-open-callback
        url: http://auth:9999/callback
        routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths:
              - /auth/v1/callback
        plugins:
          - name: cors
      - name: auth-v1-open-authorize
        url: http://auth:9999/authorize
        routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths:
              - /auth/v1/authorize
        plugins:
          - name: cors
      - name: auth-v1
        url: http://auth:9999/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths:
              - /auth/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
      - name: rest-v1
        url: http://rest:3000/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths:
              - /rest/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
      - name: graphql-v1
        url: http://rest:3000/rpc/graphql
        routes:
          - name: graphql-v1-all
            strip_path: true
            paths:
              - /graphql/v1
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Content-Profile: graphql_public"
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
      - name: meta
        url: http://meta:8080/
        routes:
          - name: meta-all
            strip_path: true
            paths:
              - /pg/
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
      - name: dashboard
        url: http://studio:3000/
        routes:
          - name: dashboard-all
            strip_path: true
            paths:
              - /
        plugins:
          - name: cors
          - name: basic-auth
            config:
              hide_credentials: true
