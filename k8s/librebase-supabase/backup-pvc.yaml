apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librebase-supabase-backups
  namespace: librebase-supabase
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librebase-waitlist-json
  namespace: librebase-supabase
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
