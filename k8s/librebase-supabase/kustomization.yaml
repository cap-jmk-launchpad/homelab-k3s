apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librebase-supabase
generatorOptions:
  disableNameSuffixHash: true
resources:
  - namespace.yaml
  # secret: apply secret.yaml manually (never commit real values; see secret.example.yaml)
  - config.yaml
  - kong-config.yaml
  - migrate-config.yaml
  - migrations-config.yaml
  - backup-config.yaml
  - db.yaml
  - auth.yaml
  - rest.yaml
  - meta.yaml
  - studio.yaml
  - kong.yaml
  - backup-pvc.yaml
  - backup-cronjobs.yaml
