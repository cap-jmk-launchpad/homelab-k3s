apiVersion: v1
kind: ConfigMap
metadata:
  name: librebase-supabase-backup-scripts
  namespace: librebase-supabase
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    TS="${TS:-$(date -u +%Y%m%dT%H%M%SZ)}"
    OUT="/backups/${TS}"
    mkdir -p "$OUT"
    export PGPASSWORD="${POSTGRES_PASSWORD}"
    pg_dump -h db -U postgres -d postgres -Fc -f "${OUT}/postgres.dump"
    pg_dump -h db -U postgres -d postgres --schema-only -f "${OUT}/schema.sql"
    echo "backup_complete ts=${TS}" > "${OUT}/README.txt"
    ls -la "$OUT"
  prune-backups.sh: |
    #!/bin/sh
    set -eu
    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    find /backups -mindepth 1 -maxdepth 1 -type d -mtime +"${RETENTION_DAYS}" -print -exec rm -rf {} +
  waitlist-backup.sh: |
    #!/bin/sh
    set -eu
    TS="${TS:-$(date -u +%Y%m%dT%H%M%SZ)}"
    OUT="/waitlist-backups"
    mkdir -p "$OUT"
    export PGPASSWORD="${POSTGRES_PASSWORD}"
    psql -h db -U postgres -d postgres -At -F $'\t' -c \
      "select coalesce(email,''), coalesce(source,''), to_char(created_at AT TIME ZONE 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS.US\"Z\"') from public.librebase_waitlist order by created_at;" \
      | awk -F '\t' 'BEGIN { print "["; first=1 }
          { if (!first) printf ",\n"; printf "  {\"email\": %s, \"source\": %s, \"createdAt\": %s}", quote($1), quote($2), quote($3); first=0 }
          function quote(s) { if (s=="") return "null"; gsub(/\\/, "\\\\", s); gsub(/"/, "\\\"", s); return "\"" s "\"" }
          END { if (!first) printf "\n"; print "]" }' > "${OUT}/librebase_waitlist.json"
    cp "${OUT}/librebase_waitlist.json" "${OUT}/librebase_waitlist.${TS}.json"
    echo "waitlist_backup_complete ts=${TS} rows=$(wc -l < "${OUT}/librebase_waitlist.json")"
