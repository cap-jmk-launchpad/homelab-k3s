apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
  namespace: librebase-supabase
  labels:
    app: rest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rest
  template:
    metadata:
      labels:
        app: rest
    spec:
      initContainers:
      - name: wait-db
        image: postgres:15-alpine
        command: ["sh", "-c", "until pg_isready -h db -p 5432 -U postgres; do sleep 2; done"]
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: librebase-supabase-secrets
              key: POSTGRES_PASSWORD
      containers:
      - name: rest
        image: postgrest/postgrest:v14.8
        imagePullPolicy: IfNotPresent
        env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              key: PGRST_DB_URI
              name: librebase-supabase-secrets
        - name: PGRST_DB_SCHEMAS
          value: public,storage,graphql_public
        - name: PGRST_DB_ANON_ROLE
          value: anon
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: librebase-supabase-secrets
        - name: PGRST_DB_EXTRA_SEARCH_PATH
          value: public
        - name: PGRST_DB_MAX_ROWS
          value: "1000"
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 192Mi
      nodeSelector:
        kubernetes.io/hostname: engine
---
apiVersion: v1
kind: Service
metadata:
  name: rest
  namespace: librebase-supabase
  labels:
    app: rest
spec:
  selector:
    app: rest
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: http
