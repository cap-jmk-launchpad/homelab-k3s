# shiphook.agentic-book.org — Shiphook deploy webhook (secret-protected).
# Public edge: :80 serves ACME webroot + proxies to Shiphook.
# :443 will be added after LE cert is issued (needs DNS A record).
upstream shiphook_agentic_book_upstream {
    server 127.0.0.1:3141;
    keepalive 4;
}
server {
    listen 80;
    server_name shiphook.agentic-book.org;
    client_max_body_size 256k;
    proxy_read_timeout 300s;

    location /.well-known/acme-challenge/ {
        root /var/lib/li-httpd;
    }

    location / {
        proxy_pass http://shiphook_agentic_book_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
