# agentic-book.org HTTPS — LE cert already covers agentic-book.org (SAN used by
# supabase.agentic-book.org). Backend: k3s NodePort 30620 (Service
# agentic-svc, namespace agentic-book).
# Mirrors k8s/edge/nginx-agentic-book-supabase.conf.

    upstream agentic_book_web {
        server 127.0.0.1:30620;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agentic-book.org www.agentic-book.org;

        ssl_certificate     /etc/letsencrypt/live/agentic-book.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agentic-book.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 50m;
        proxy_read_timeout 120s;

        location /.well-known/acme-challenge/ {
            root /var/lib/li-httpd;
        }

        location / {
            proxy_pass http://agentic_book_web;
            # WHY THE LARGE BUFFERS (do not lower without reading this):
            # After a successful Supabase PKCE exchange, /auth/callback answers
            # with several large Set-Cookie headers (access + refresh JWTs plus
            # code-verifier cleanup cookies, several KB total). nginx's default
            # proxy_buffer_size (4k/8k) cannot hold the upstream response
            # headers, so nginx aborts with 502 and logs "upstream sent too big
            # header while reading response header from upstream" — even though
            # the app, the cert, and the routing are all healthy. The cruel
            # symptom: login actually SUCCEEDS server-side, then the user sees
            # Bad Gateway (incident 2026-09-06/07). 32k comfortably fits a
            # successful exchange; raise further if Set-Cookie payload grows.
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name agentic-book.org www.agentic-book.org;

        location /.well-known/acme-challenge/ {
            root /var/lib/li-httpd;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
