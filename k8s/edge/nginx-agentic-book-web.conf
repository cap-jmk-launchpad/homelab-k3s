# agentic-book.org HTTPS — LE cert already covers agentic-book.org (SAN used by
# supabase.agentic-book.org). Backend: k3s NodePort 30608 (Service
# agentic-book-web, namespace agentic-book-supabase).
# Mirrors k8s/edge/nginx-agentic-book-supabase.conf.

    upstream agentic_book_web {
        server 127.0.0.1:30608;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agentic-book.org www.agentic-book.org;

        ssl_certificate     /etc/letsencrypt/live/agentic-book.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agentic-book.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 50m;
        proxy_read_timeout 120s;

        location /.well-known/acme-challenge/ {
            root /var/lib/li-httpd;
        }

        location / {
            proxy_pass http://agentic_book_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name agentic-book.org www.agentic-book.org;

        location /.well-known/acme-challenge/ {
            root /var/lib/li-httpd;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
