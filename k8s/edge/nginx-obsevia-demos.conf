    server {
        listen 443 ssl;
        http2 on;
        server_name api.obsevia.com;

        ssl_certificate     /etc/letsencrypt/live/api.obsevia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.obsevia.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Edge-local liveness for blackbox (do not shadow backend /health JSON).
        location = /nginx-health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Proxy /health to FastAPI so monitors see status/supabase/vector flags.
        location = /health {
            proxy_pass http://api_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://api_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name inbiome.obsevia.com;

        ssl_certificate     /etc/letsencrypt/live/inbiome.obsevia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/inbiome.obsevia.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /robots.txt {
            default_type text/plain;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Own Supabase — do not use shared nginx-obsevia-demo-supabase-api-locations.conf
        location /auth/v1/ {
            proxy_pass http://inbiome_supabase_kong;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /rest/v1/ {
            proxy_pass http://inbiome_supabase_kong;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /realtime/v1/ {
            proxy_pass http://inbiome_supabase_kong;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            proxy_pass http://inbiome_demo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

