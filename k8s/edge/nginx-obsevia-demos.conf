# Obsevia demo HTTPS — installed to /etc/nginx/gitlab-edge/nginx-obsevia-demos.conf
# and included by edge-nginx-apply.sh when LE certs exist on disk.
# location = /health is edge-local (tiny plaintext) so blackbox does not pull Next.js HTML.
# Demo vhosts: edge-local /robots.txt Disallow:/ + X-Robots-Tag noindex (landing#3 P2-1).
# edge-nginx-apply REFUSES to install this file if it has fewer than 7 /health locations.
# Demo auth/rest/realtime go to supabase_kong (see nginx-obsevia-demo-supabase-api-locations.conf)
# so broken Next.js build-time rewrites cannot take demos offline.

    upstream obsevia_landing {
        server 127.0.0.1:30594;
        keepalive 8;
    }

    upstream ducah_demo {
        server 127.0.0.1:30583;
        keepalive 8;
    }

    upstream qroma_demo {
        server 127.0.0.1:30584;
        keepalive 8;
    }

    upstream unitedhealth_demo {
        server 127.0.0.1:30588;
        keepalive 8;
    }

    upstream chat_prod {
        server 127.0.0.1:30581;
        keepalive 8;
    }

    upstream dp_demo {
        server 127.0.0.1:30582;
        keepalive 8;
    }

    upstream supabase_kong {
        server 127.0.0.1:30480;
        keepalive 8;
    }

    upstream api_prod {
        server 127.0.0.1:30589;
        keepalive 8;
    }

    upstream inbiome_demo {
        server 127.0.0.1:30598;
        keepalive 8;
    }

    # Dedicated inbiome Supabase Kong (NOT shared 30480) — on-prem shippable stack
    upstream inbiome_supabase_kong {
        server 127.0.0.1:30599;
        keepalive 8;
    }

    # Medreich still runs on VPS1; edge terminates TLS + SEO headers (landing#3 P2-1).
    upstream medreich_vps1_origin {
        server 82.165.195.105:443;
        keepalive 8;
    }

    # Obsevia One — chat-first consolidation (one.obsevia.com)
    upstream oneapp {
        server 127.0.0.1:30630;
        keepalive 8;
    }

    # Apex → www (landing#3 P3-2). Keep /health local for blackbox.
    server {
        listen 443 ssl;
        http2 on;
        server_name obsevia.com;

        ssl_certificate     /etc/letsencrypt/live/obsevia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/obsevia.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://www.obsevia.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.obsevia.com;

        ssl_certificate     /etc/letsencrypt/live/obsevia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/obsevia.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://obsevia_landing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Powered-By;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ducah.obsevia.com;

        ssl_certificate     /etc/letsencrypt/live/ducah.obsevia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ducah.obsevia.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
