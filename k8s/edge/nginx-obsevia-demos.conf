    server {
        listen 443 ssl;
        http2 on;
        server_name inbiome.obsevia.com;

        ssl_certificate     /etc/letsencrypt/live/inbiome.obsevia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/inbiome.obsevia.com/privkey.pem;
