# www.lilangverse.xyz has no separate site. Send it to the apex.
# Cert SAN must include www.lilangverse.xyz (same lineage as lilangverse.xyz).

server {
    listen 80;
    server_name www.lilangverse.xyz;

    location /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/li-httpd;
    }

    location / {
        return 301 https://lilangverse.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.lilangverse.xyz;

    ssl_certificate     /etc/letsencrypt/live/lilangverse.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lilangverse.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://lilangverse.xyz$request_uri;
}
