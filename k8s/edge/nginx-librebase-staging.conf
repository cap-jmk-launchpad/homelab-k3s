# Librebase staging via Docker on engine (192.168.10.32:3006).
#   stage.librebase.xyz      -> landing (next.js marketing routes)
#   app-stage.librebase.xyz  -> app/MCP surface (studio, /api/mcp, /.well-known/mcp.json)
# Cert: certbot stage.librebase.xyz expanded with -d app-stage.librebase.xyz.

upstream librebase_staging_https {
    server 192.168.10.32:3006;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stage.librebase.xyz app-stage.librebase.xyz;

    ssl_certificate     /etc/letsencrypt/live/stage.librebase.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.librebase.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /deploy {
        proxy_pass http://192.168.10.32:54355;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location / {
        proxy_pass http://librebase_staging_https;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name stage.librebase.xyz app-stage.librebase.xyz;
    location /.well-known/acme-challenge/ { root /var/lib/li-httpd; }
    location / { return 301 https://$host$request_uri; }
}
