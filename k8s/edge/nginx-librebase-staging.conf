# Temporary fallback while engine 192.168.10.32 is offline (2026-10-10).
# Studio is systemd librebase-staging-studio.service on blackpearl (127.0.0.1:3006),
# built from GitHub librebase-saas 07b8c04. Admin is librebase-staging-admin.service
# on 127.0.0.1:54331. Point the upstream back at 192.168.10.32:3006 when that host
# returns. /deploy is librebase-staging-webhook.service on 127.0.0.1:54355 (HMAC). Point that proxy back at 192.168.10.32:54355 when the engine returns.
#   stage.librebase.xyz      -> landing (next.js marketing routes)
#   app-stage.librebase.xyz  -> app/MCP surface (studio, /api/mcp, /.well-known/mcp.json)
# Cert: certbot stage.librebase.xyz expanded with -d app-stage.librebase.xyz.

upstream librebase_staging_https {
    server 127.0.0.1:3006;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stage.librebase.xyz app-stage.librebase.xyz;

    ssl_certificate     /etc/letsencrypt/live/stage.librebase.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.librebase.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /deploy {
        proxy_pass http://127.0.0.1:54355;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The staging webhook deploys synchronously: it replies only after the
        # deploy script finishes (builds + health waits), which can take minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location / {
        proxy_pass http://librebase_staging_https;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name stage.librebase.xyz app-stage.librebase.xyz;
    location /.well-known/acme-challenge/ { root /var/lib/li-httpd; }
    location / { return 301 https://$host$request_uri; }
}