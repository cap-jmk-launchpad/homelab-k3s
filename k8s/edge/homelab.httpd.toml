# Homelab edge routes (k8s-maintainance) — li-native WAN + LAN.
# Merged with majico-staging.httpd.toml on blackpearl — see scripts/edge-lis-apply.sh.
# Backends: k3s NodePorts on loopback (kube-proxy).
# Policy: docs/li-native-edge.md

# listen on :80 is per [[site]]; :8443 TLS dev overlay uses gen-https-overlay (prod GitLab: nginx :443).
[server]
document_root = "/var/lib/li-httpd/empty"

[health]
max_fails = 3
fail_timeout = "10s"

[limits]
# GitLab Omnibus: git push/LFS uploads + webpack assets through edge proxy
max_body = "512m"
max_header = "32k"
proxy_max_response_body = "64m"
# 0 = no concurrent-stream 429 gate on :80 (GitLab WAN uses nginx :443; HTTP stays for ACME + legacy hosts)
concurrent_streams = 0
use_native_proxy_relay = true
# max_routes = 0   # default: unlimited dynamic route table (200+ [[site]] routes)
# max_routes = 512 # optional hard cap; load fails if flattened config exceeds N

