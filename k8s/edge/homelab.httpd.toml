# li-mail gateway — JMAP + admin API (NodePort 30586 on blackpearl).
[[site]]
host = "mail.lilangverse.xyz"
listen = ":80"

[site.routes]
"GET /health" = "static:healthcheck"
"GET /healthz" = "proxy:li_mail_gateway"
"GET /.well-known/jmap" = "proxy:li_mail_gateway"
"GET /jmap/*" = "proxy:li_mail_gateway"
"POST /jmap/*" = "proxy:li_mail_gateway"
"GET /webmail/*" = "proxy:li_mail_gateway"
"POST /webmail/*" = "proxy:li_mail_gateway"
"GET /caldav/*" = "proxy:li_mail_gateway"
"POST /caldav/*" = "proxy:li_mail_gateway"
"GET /carddav/*" = "proxy:li_mail_gateway"
"POST /carddav/*" = "proxy:li_mail_gateway"
"GET /.well-known/caldav" = "proxy:li_mail_gateway"
"GET /v1/mail/*" = "proxy:li_mail_gateway"
"POST /v1/mail/*" = "proxy:li_mail_gateway"

# li-auth OIDC issuer — LAN-only (auth.mail.homelab.lan). NodePort 30600.
[[site]]
host = "auth.mail.homelab.lan"
listen = ":80"

[site.routes]
"GET /health" = "static:healthcheck"
"GET /healthz" = "proxy:li_auth"
"GET /.well-known/openid-configuration" = "proxy:li_auth"
"GET /jwks.json" = "proxy:li_auth"
"GET /.well-known/jwks.json" = "proxy:li_auth"
"GET /oauth/*" = "proxy:li_auth"
"POST /oauth/*" = "proxy:li_auth"
"GET /authorize" = "proxy:li_auth"
"POST /authorize" = "proxy:li_auth"
"GET /token" = "proxy:li_auth"
"POST /token" = "proxy:li_auth"

# Operator Admin — LAN-only (admin.mail.homelab.lan). NodePort 30601. No Fritz WAN.
