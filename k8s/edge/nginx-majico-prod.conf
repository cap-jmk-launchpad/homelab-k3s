# Majico PROD TLS vhost for nginx-gitlab-edge (:443) on blackpearl.
# Fixes ERR_CERT_COMMON_NAME_INVALID: supabase.majico.xyz resolves to blackpearl
# but had no server_name block, so the SNI fell through to the lip.lilangverse.xyz
# default vhost (wrong cert).
#
#   supabase.majico.xyz  -> majico-prod Supabase Kong NodePort :30100
#
# Cert: /etc/letsencrypt/live/supabase.majico.xyz (webroot /var/www/certbot).
# Include this file from nginx-gitlab-edge.conf.

upstream majico_prod_kong {
    # majico-prod Supabase Kong on blackpearl.
    server 127.0.0.1:30100;
    keepalive 16;
}

# ACME webroot challenge + HTTPS redirect.
server {
    listen 80;
    server_name supabase.majico.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name supabase.majico.xyz;

    ssl_certificate     /etc/letsencrypt/live/supabase.majico.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.majico.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    location / {
        proxy_pass http://majico_prod_kong;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }
}
