# /etc/nginx/sites-available/agentic-book.org.conf on Hetzner VPS (2.31.25.5)
# Reverse proxy for agentic-book.org and supabase.agentic-book.org to blackpearl.

upstream blackpearl_agentic_web {
    server 146.52.208.224:443;
    keepalive 16;
}

upstream blackpearl_agentic_supabase {
    server 146.52.208.224:443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name agentic-book.org www.agentic-book.org supabase.agentic-book.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agentic-book.org www.agentic-book.org;

    ssl_certificate /etc/letsencrypt/live/agentic-book.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentic-book.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    location / {
        proxy_pass https://blackpearl_agentic_web;

        proxy_ssl_server_name on;
        proxy_ssl_name agentic-book.org;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Host agentic-book.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supabase.agentic-book.org;

    ssl_certificate /etc/letsencrypt/live/agentic-book.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentic-book.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    location / {
        proxy_pass https://blackpearl_agentic_supabase;

        proxy_ssl_server_name on;
        proxy_ssl_name supabase.agentic-book.org;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Host supabase.agentic-book.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
