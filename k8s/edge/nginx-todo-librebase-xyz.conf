# todo.librebase.xyz HTTPS vhost — included from nginx-gitlab-edge.conf (:443).
# Upstream: k3s NodePort librebase/todo-app:30500 → todo-app :8787.
# Cert: certbot todo.librebase.xyz (install before nginx -t).

upstream librebase_todo_https {
    server 127.0.0.1:30500;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name todo.librebase.xyz;

    ssl_certificate     /etc/letsencrypt/live/todo.librebase.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.librebase.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://librebase_todo_https;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
