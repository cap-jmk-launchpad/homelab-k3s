# mcp.agentic-book.org — remote MCP for coding agents (streamable HTTP).
# Backend: k3s NodePort 30621 (namespace agentic-book, deployment mcp).

    upstream agentic_book_mcp {
        server 127.0.0.1:30621;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mcp.agentic-book.org;

        ssl_certificate     /etc/letsencrypt/live/agentic-book.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agentic-book.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 50m;
        proxy_read_timeout 120s;

        location /.well-known/acme-challenge/ {
            root /var/lib/li-httpd;
        }

        location / {
            proxy_pass http://agentic_book_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_set_header Accept-Encoding "";

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, mcp-session-id, mcp-protocol-version, Last-Event-ID";
                add_header Access-Control-Max-Age 86400;
                return 204;
            }
        }
    }

    server {
        listen 80;
        server_name mcp.agentic-book.org;

        location /.well-known/acme-challenge/ {
            root /var/lib/li-httpd;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
