# shiphook.obsevia.d3bu7.com — Shiphook deploy webhook (secret-protected).
# Public edge: :80 serves ACME webroot + proxies to Shiphook; :443 proxies to Shiphook.
upstream shiphook_obsevia_upstream {
    server 127.0.0.1:3141;
    keepalive 4;
}
server {
    listen 80;
    server_name shiphook.obsevia.d3bu7.com;
    client_max_body_size 256k;
    proxy_read_timeout 300s;

    location /.well-known/acme-challenge/ {
        root /var/lib/li-httpd;
    }

    location / {
        proxy_pass http://shiphook_obsevia_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name shiphook.obsevia.d3bu7.com;
    ssl_certificate /etc/letsencrypt/live/shiphook.obsevia.d3bu7.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiphook.obsevia.d3bu7.com/privkey.pem;
    client_max_body_size 256k;
    proxy_read_timeout 300s;

    location /.well-known/acme-challenge/ {
        root /var/lib/li-httpd;
    }

    location / {
        proxy_pass http://shiphook_obsevia_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
