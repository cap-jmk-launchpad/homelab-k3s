# Missing :443 vhosts — certs live in /etc/letsencrypt/live/*, but no server_name
# block existed, so the SNI fell through to the :443 default vhost (lip.lilangverse.xyz)
# and returned that cert -> ERR_CERT_COMMON_NAME_INVALID.
#
#   supabase.librebase.xyz  -> librebase-supabase Kong :30606
#   librebase.librebase.xyz -> librebase studio        :30400
#   vault.klaut.pro         -> cwe vault               :30485
#
# mail.bureauzilla.com intentionally NOT added: it's the MX for bureauzilla.com,
# SMTP only (no HTTP web service to route).

upstream supabase_librebase_kong {
    server 127.0.0.1:30606;
    keepalive 16;
}
upstream librebase_studio {
    server 127.0.0.1:30400;
    keepalive 8;
}
upstream vault_klaut {
    server 127.0.0.1:30485;
    keepalive 8;
}

server {
    listen 80;
    server_name supabase.librebase.xyz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://supabase.librebase.xyz$request_uri; }
}
server {
    listen 443 ssl; http2 on;
    server_name supabase.librebase.xyz;
    ssl_certificate     /etc/letsencrypt/live/supabase.librebase.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.librebase.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;  ssl_prefer_server_ciphers off;
    client_max_body_size 100m;
    proxy_read_timeout    300s;  proxy_send_timeout 300s;  proxy_connect_timeout 60s;
    location / {
        proxy_pass http://supabase_librebase_kong;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name librebase.librebase.xyz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://librebase.librebase.xyz$request_uri; }
}
server {
    listen 443 ssl; http2 on;
    server_name librebase.librebase.xyz;
    ssl_certificate     /etc/letsencrypt/live/librebase.librebase.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/librebase.librebase.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;  ssl_prefer_server_ciphers off;
    client_max_body_size 25m;
    proxy_read_timeout    300s;  proxy_send_timeout 300s;  proxy_connect_timeout 60s;
    location / {
        proxy_pass http://librebase_studio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name vault.klaut.pro;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vault.klaut.pro$request_uri; }
}
server {
    listen 443 ssl; http2 on;
    server_name vault.klaut.pro;
    ssl_certificate     /etc/letsencrypt/live/vault.klaut.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.klaut.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;  ssl_prefer_server_ciphers off;
    client_max_body_size 25m;
    proxy_read_timeout    300s;  proxy_send_timeout 300s;  proxy_connect_timeout 60s;
    location / {
        proxy_pass http://vault_klaut;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
    }
}
