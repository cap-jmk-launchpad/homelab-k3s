# obsevia.com / www.obsevia.com — LE cert from blackpearl certbot.
# Included by nginx-gitlab-edge.conf. Prefer nginx-obsevia-demos.conf when both
# are present (demos is included first); keep this file in sync for safety.
# :80 redirect lives in nginx-obsevia-http-front.conf.

# Apex → www (landing#3 P3-2)
server {
    listen 443 ssl;
    http2 on;
    server_name obsevia.com;

    ssl_certificate     /etc/letsencrypt/live/obsevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obsevia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/li-httpd;
    }

    location / {
        return 301 https://www.obsevia.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.obsevia.com;

    ssl_certificate     /etc/letsencrypt/live/obsevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obsevia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/li-httpd;
    }

    location / {
        proxy_pass http://127.0.0.1:30594;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
    }

    location ~* \.(ico|png|svg|webp|css|js|json|map|woff2?|ttf|eot|otf|mp4|webm)$ {
        proxy_pass http://127.0.0.1:30594;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
