# Homelab edge — nginx TLS terminator on :443 / HTTP front on :80.
# Single source of truth: this file + the per-app snippets in k8s/edge/.
# Deployed verbatim by scripts/edge-nginx-apply.sh (no marker/sed assembly).
#   nginx :443 -> k3s NodePorts on loopback (kube-proxy)
#   nginx :80  -> HTTPS redirects + default proxy to li-httpd on 127.0.0.1:8080
#   li-httpd   -> :8080 (HTTP backends) / :8443 (dev TLS overlay)
#
# Do NOT hand-edit /etc/nginx/gitlab-edge/nginx.conf on the server; change the
# file here and re-run scripts/edge-nginx-apply.sh.

worker_processes auto;
error_log /var/log/nginx/gitlab-edge-error.log warn;
pid /run/nginx-gitlab-edge.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Match homelab.httpd.toml [limits] for Git LFS / large assets
    client_max_body_size 512m;

    upstream gitlab {
        server 127.0.0.1:30481;
        keepalive 32;
    }

    upstream gitlab_pages {
        server 127.0.0.1:30486;
        keepalive 8;
    }

    upstream lip_registry {
        server 127.0.0.1:30422;
        keepalive 8;
    }

    upstream lip_static {
        server 127.0.0.1:30423;
        keepalive 4;
    }

    upstream agentic_book {
        server 127.0.0.1:30620;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name lip.lilangverse.xyz;

        ssl_certificate     /etc/letsencrypt/live/lip.lilangverse.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lip.lilangverse.xyz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        location /health {
            proxy_pass http://lip_registry;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }

        location /v1/ {
            proxy_pass http://lip_registry;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }

        location /account {
            proxy_pass http://lip_static;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }

        location / {
            proxy_pass http://lip_static;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name gitlab.lilangverse.xyz registry.gitlab.lilangverse.xyz;

        ssl_certificate     /etc/letsencrypt/live/gitlab.lilangverse.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gitlab.lilangverse.xyz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://gitlab;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name lilangverse.xyz;

        ssl_certificate     /etc/letsencrypt/live/lilangverse.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lilangverse.xyz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Install bootstrap scripts (synced from lic site/ via deploy script)
        root /var/www/lilangverse;
        index index.html;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /cli/ {
            alias /var/www/lilangverse/cli/;
            default_type text/plain;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name benchmarks.lilangverse.xyz;

        ssl_certificate     /etc/letsencrypt/live/benchmarks.lilangverse.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/benchmarks.lilangverse.xyz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://gitlab_pages/benchmarks/;
            proxy_http_version 1.1;
            proxy_set_header Host li-langverse.gitlab.lilangverse.xyz;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name progress.lilangverse.xyz;

        ssl_certificate     /etc/letsencrypt/live/progress.lilangverse.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/progress.lilangverse.xyz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # GitLab Pages serves roadmap under /roadmap/ on the default *.gitlab host until
        # the custom domain is verified; use that upstream until verified=true.
        location / {
            proxy_pass http://gitlab_pages/roadmap/;
            proxy_http_version 1.1;
            proxy_set_header Host li-langverse.gitlab.lilangverse.xyz;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name li-langverse.gitlab.lilangverse.xyz;

        ssl_certificate     /etc/letsencrypt/live/li-langverse.gitlab.lilangverse.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/li-langverse.gitlab.lilangverse.xyz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://gitlab_pages;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }
    }

    # agentic-book.org HTTP :80 — ACME webroot + HTTPS redirect.
    server {
        listen 80;
        server_name agentic-book.org www.agentic-book.org;

        location /.well-known/acme-challenge/ {
            root /var/lib/li-httpd;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agentic-book.org www.agentic-book.org;

        ssl_certificate     /etc/letsencrypt/live/agentic-book.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agentic-book.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://agentic_book;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

    # --- Per-app vhosts (one include per app; each file lives in k8s/edge/) ---
    include /etc/nginx/gitlab-edge/majico-staging.conf;
    include /etc/nginx/gitlab-edge/nginx-agentic-book-supabase.conf;
    include /etc/nginx/gitlab-edge/nginx-obsevia-demos.conf;
    include /etc/nginx/gitlab-edge/nginx-obsevia-main.conf;
    include /etc/nginx/gitlab-edge/nginx-todo-librebase-xyz.conf;
    include /etc/nginx/gitlab-edge/nginx-klaut-pro.conf;
    include /etc/nginx/gitlab-edge/nginx-bureauzilla.conf;
    include /etc/nginx/gitlab-edge/nginx-bureauzilla-supabase.conf;
    include /etc/nginx/gitlab-edge/yieldscope.conf;
    include /etc/nginx/gitlab-edge/yieldscope-supabase.conf;
    include /etc/nginx/gitlab-edge/nginx-mail-https.conf;
    include /etc/nginx/gitlab-edge/nginx-collins.conf;
    include /etc/nginx/gitlab-edge/nginx-telekom.conf;
    include /etc/nginx/gitlab-edge/nginx-meetfriends.conf;
    include /etc/nginx/gitlab-edge/nginx-sikant.conf;
    include /etc/nginx/gitlab-edge/nginx-reeldemo-supabase.conf;
    include /etc/nginx/gitlab-edge/nginx-demo-bureauzilla.conf;
    include /etc/nginx/gitlab-edge/nginx-obsevia-http-front.conf;
    include /etc/nginx/gitlab-edge/nginx-reeldemo-supabase-http.conf;
    include /etc/nginx/gitlab-edge/nginx-demo-bureauzilla-http.conf;
    include /etc/nginx/gitlab-edge/nginx-julianmkleber.conf;
    include /etc/nginx/gitlab-edge/nginx-crm-sailblack.conf;
    include /etc/nginx/gitlab-edge/nginx-librebase-staging.conf;
    include /etc/nginx/gitlab-edge/nginx-shiphook-obsevia.conf;
}
