# One secret per GitHub org (PAT or GitHub App credentials for ARC).
# Create real secrets with scripts/k8s-github-actions-secret.sh — do not commit tokens.
#
# PAT scopes (classic): repo, read:org, admin:org (org runners) OR repo-only for repo-level URL.
# Fine-grained: Administration + Actions on the org/repos you register.
