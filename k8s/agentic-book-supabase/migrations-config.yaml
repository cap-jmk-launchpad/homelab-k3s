apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-book-supabase-migrations
  namespace: agentic-book-supabase
data:
  20260812130000_agentic_book_capture.sql: |
    -- Agentic Book waitlist + feedback capture
    -- Hosted on free-tier Supabase project until a dedicated ref is available.
    
    create table if not exists public.agentic_book_waitlist (
      id uuid primary key default gen_random_uuid(),
      email text not null,
      role text,
      source text not null default 'agentic-book.org',
      user_agent text,
      created_at timestamptz not null default now(),
      constraint agentic_book_waitlist_email_key unique (email)
    );
    
    create table if not exists public.agentic_book_feedback (
      id uuid primary key default gen_random_uuid(),
      email text,
      message text not null,
      page_path text,
      user_agent text,
      created_at timestamptz not null default now(),
      constraint agentic_book_feedback_message_len check (char_length(message) between 1 and 4000)
    );
    
    create index if not exists agentic_book_waitlist_created_at_idx
      on public.agentic_book_waitlist (created_at desc);
    
    create index if not exists agentic_book_feedback_created_at_idx
      on public.agentic_book_feedback (created_at desc);
    
    alter table public.agentic_book_waitlist enable row level security;
    alter table public.agentic_book_feedback enable row level security;
    
    -- No anon policies. Next.js API routes insert with service_role (bypasses RLS).
    
  20260814000000_platform.sql: |
    -- Agentic Book — platform schema: books, entitlements, subscriptions, api_keys, usage.
    -- Multi-book ready. Entitlements are the single source of truth for "can this
    -- user read book X" (one-time purchase). Subscriptions cover the future
    -- "agentic books" access tier. API keys let a user's coding agent talk to the
    -- remote MCP / content API.
    --
    -- Auth lives in Supabase GoTrue (auth.users). These tables reference it.
    
    -- ---------------------------------------------------------------------------
    -- Books: the catalog. One row per book (and later, per "agentic edition").
    -- ---------------------------------------------------------------------------
    create table if not exists public.books (
      id uuid primary key default gen_random_uuid(),
      slug text not null unique,
      title text not null,
      subtitle text,
      -- 'book' = plain book (one-time purchase); 'agentic' = agentic edition
      -- (included in a subscription rather than bought individually).
      kind text not null default 'book' check (kind in ('book', 'agentic')),
      price_cents integer not null default 0 check (price_cents >= 0),
      currency text not null default 'usd',
      status text not null default 'draft' check (status in ('draft', 'published', 'archived')),
      cover_url text,
      toc jsonb not null default '[]'::jsonb,
      meta jsonb not null default '{}'::jsonb,
      created_at timestamptz not null default now(),
      updated_at timestamptz not null default now()
    );
    
    create index if not exists books_slug_idx on public.books (slug);
    create index if not exists books_status_idx on public.books (status);
    
    -- ---------------------------------------------------------------------------
    -- Entitlements: user_id -> book_id. One-time purchase grants read access.
    -- A unique (user_id, book_id) means a user owns a book once.
    -- ---------------------------------------------------------------------------
    create table if not exists public.entitlements (
      id uuid primary key default gen_random_uuid(),
      user_id uuid not null references auth.users (id) on delete cascade,
      book_id uuid not null references public.books (id) on delete cascade,
      -- source: 'purchase' (Stripe), 'grant' (manual/admin), 'subscription' (agentic tier).
      source text not null default 'purchase',
      price_paid_cents integer,
      currency text,
      created_at timestamptz not null default now(),
      constraint entitlements_user_book_key unique (user_id, book_id)
    );
    
    create index if not exists entitlements_user_idx on public.entitlements (user_id);
    create index if not exists entitlements_book_idx on public.entitlements (book_id);
    
    -- ---------------------------------------------------------------------------
    -- Subscriptions: future "agentic books" access tier. Empty for now; the
    -- schema is here so Stripe webhooks have a home when we turn it on.
    -- ---------------------------------------------------------------------------
    create table if not exists public.subscriptions (
      id uuid primary key default gen_random_uuid(),
      user_id uuid not null references auth.users (id) on delete cascade,
      plan text not null default 'agentic_books',
      status text not null default 'active' check (status in ('active', 'canceled', 'past_due', 'trialing')),
      stripe_subscription_id text unique,
      stripe_customer_id text,
      current_period_end timestamptz,
      created_at timestamptz not null default now(),
      updated_at timestamptz not null default now()
    );
    
    create index if not exists subscriptions_user_idx on public.subscriptions (user_id);
    
    -- ---------------------------------------------------------------------------
    -- API keys: a user mints keys for their coding agents. We store only a hash
    -- (sha256 of the secret) — the secret is shown once at creation.
    -- ---------------------------------------------------------------------------
    create table if not exists public.api_keys (
      id uuid primary key default gen_random_uuid(),
      user_id uuid not null references auth.users (id) on delete cascade,
      name text not null,
      -- sha256 hex of the secret. Lookup by hashing the presented key.
      key_hash text not null unique,
      -- last 4 of the secret for display ("sk_...abcd").
      hint text,
      scopes jsonb not null default '["book:read"]'::jsonb,
      revoked_at timestamptz,
      last_used_at timestamptz,
      created_at timestamptz not null default now()
    );
    
    create index if not exists api_keys_user_idx on public.api_keys (user_id) where revoked_at is null;
    
    -- ---------------------------------------------------------------------------
    -- Usage: per-key call log (for rate limiting / auditing later). High volume;
    -- index on (key_id, created_at).
    -- ---------------------------------------------------------------------------
    create table if not exists public.api_usage (
      id uuid primary key default gen_random_uuid(),
      key_id uuid not null references public.api_keys (id) on delete cascade,
      tool text not null,
      book_id uuid references public.books (id) on delete set null,
      tokens integer,
      ip text,
      created_at timestamptz not null default now()
    );
    
    create index if not exists api_usage_key_created_idx on public.api_usage (key_id, created_at desc);
    
    -- ---------------------------------------------------------------------------
    -- RLS: everything is private by default. The web app's server-side routes use
    -- service_role (bypasses RLS). Users see only their own rows via JWT.
    -- ---------------------------------------------------------------------------
    alter table public.books enable row level security;
    alter table public.entitlements enable row level security;
    alter table public.subscriptions enable row level security;
    alter table public.api_keys enable row level security;
    alter table public.api_usage enable row level security;
    
    -- Public read of *published* book metadata (catalog page).
    create policy "published books are readable" on public.books
      for select using (status = 'published');
    
    -- A user can read their own entitlements, subscriptions, keys, and usage.
    create policy "users read own entitlements" on public.entitlements
      for select using (auth.uid() = user_id);
    create policy "users read own subscriptions" on public.subscriptions
      for select using (auth.uid() = user_id);
    create policy "users read own api keys" on public.api_keys
      for select using (auth.uid() = user_id);
    create policy "users insert own api keys" on public.api_keys
      for insert with check (auth.uid() = user_id);
    create policy "users revoke own api keys" on public.api_keys
      for update using (auth.uid() = user_id);
    create policy "users read own usage" on public.api_usage
      for select using (exists (
        select 1 from public.api_keys k where k.id = key_id and k.user_id = auth.uid()
      ));
    
    -- Grants for authenticated role (insert of entitlements/subscriptions goes
    -- through service_role only; users never self-grant).
    grant usage on schema public to anon, authenticated, service_role;
    grant select on public.books to anon, authenticated, service_role;
    grant select, insert, update on public.entitlements to service_role;
    grant select on public.entitlements to authenticated;
    grant select on public.subscriptions to authenticated;
    grant select, insert, update, delete on public.subscriptions to service_role;
    grant select, insert, update on public.api_keys to authenticated, service_role;
    grant select, insert on public.api_usage to service_role;
    grant select on public.api_usage to authenticated;
    
    notify pgrst, 'reload schema';
    
    -- ---------------------------------------------------------------------------
    -- Helper: can this user read this book?
    --   true if they own an entitlement, OR hold an active agentic subscription
    --   covering the book's kind.
    -- ---------------------------------------------------------------------------
    create or replace function public.can_read_book(p_user uuid, p_book uuid)
    returns boolean
    language sql
    stable
    as $$
      select exists (
        select 1 from public.entitlements e
        where e.user_id = p_user and e.book_id = p_book
      )
      or exists (
        select 1
        from public.subscriptions s
        join public.books b on b.id = p_book
        where s.user_id = p_user
          and s.status = 'active'
          and b.kind = 'agentic'
      );
    $$;
    
    -- Helper: resolve an API key to its owner (and check it's not revoked).
    -- Takes the raw secret, hashes it, returns the matching active key id + user.
    create or replace function public.resolve_api_key(p_key text)
    returns table (key_id uuid, user_id uuid, scopes jsonb)
    language sql
    stable
    as $$
      select k.id, k.user_id, k.scopes
      from public.api_keys k
      where k.key_hash = encode(sha256(p_key::bytea), 'hex')
        and k.revoked_at is null;
    $$;
    
