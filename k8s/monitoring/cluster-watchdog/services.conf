# cluster-watchdog service inventory (canonical source of truth for "services we made").
# Used by scripts/cluster-watchdog.sh to probe WAN/LAN backends and keep them up.
#
# format: name:nodePort:probe_path:restart(0/1):namespace_hint
#   name            human label
#   nodePort        k3s NodePort on blackpearl (127.0.0.1:<nodePort> is probed)
#   probe_path      HTTP path; empty => "/"
#   restart         0 = watchdog restarts pods if this service is down
#                   1 = MONITOR-only (e.g. agent-swarm dashboards); never restart
#   namespace_hint  namespace owning the Service (speeds lookup); "" => discover by NodePort
#
# Probe host ports (li-httpd :80 / nginx :443) are handled inside cluster-watchdog.sh
# heal_edge(), not listed here.
gitlab:30481:/users/sign_in:0:gitlab
searxng:30479:/:0:searxng
supabase:30480:/rest/v1/:0:supabase
dependency-track:30482:/:0:dependency-track
cwe:30483:/manifest.json:0:cwe
vault:30485:/v3/:0:vault
li-research:30487:/:0:li-research
todo:30500:/health:0:librebase
portfolio:30585::0:
agents-dashboard:30477:/api/health:1:agent-swarm

# Bureauzilla marketing app (web/api + demo) on engine.
# NOTE: pods currently fail ErrImageNeverPull — the referenced images
# (docker.io/library/bureauzlib-*.latest) were never built/loaded, and the
# ghcr.io/bureauzlib/* packages are untagged. restart=1 (monitor-only) so the
# watchdog reports them DOWN without deleting the orphaned pods (there is no
# Deployment controller to recreate them). FLIP to 0 once images + a controller
# exist, so the watchdog recycles failures instead of logging them. See issue
# "bureauzlib images unpublished".
bureauzlib-web:30596:/:1:bureauzlib
bureauzlib-demo-web:30611:/:1:bureauzlib-demo
bureauzlib-demo-api:30612:/:1:bureauzlib-demo
