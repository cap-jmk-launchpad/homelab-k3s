# cluster-watchdog service inventory (canonical source of truth for "services we made").
# Used by scripts/cluster-watchdog.sh to probe WAN/LAN backends and keep them up.
#
# format: name:nodePort:probe_path:restart(0/1):namespace_hint
#   name            human label
#   nodePort        k3s NodePort on blackpearl (127.0.0.1:<nodePort> is probed)
#   probe_path      HTTP path; empty => "/"
#   restart         0 = watchdog restarts pods if this service is down
#                   1 = MONITOR-only (e.g. agent-swarm dashboards); never restart
#   namespace_hint  namespace owning the Service (speeds lookup); "" => discover by NodePort
#
# Probe host ports (li-httpd :80 / nginx :443) are handled inside cluster-watchdog.sh
# heal_edge(), not listed here.
